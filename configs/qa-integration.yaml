schema_version: 1
name: qa-integration
run_type: integration
paths:
  prepared: data/integration/halueval-qa-30.jsonl
  embeddings: data/integration/halueval-qa-30.npz
  output_dir: results/qa-integration
dataset:
  name: HaluEval-QA
  source_revision: integration-fixture
  source_sha256: null
  source_rows: 30
  selected_records: 30
  split_seed: 42
  split_counts:
    train: 24
    val: 3
    test: 3
encoder:
  model: fixture/deberta-replacement
  revision: no-model-download-in-tests
  device: cpu
  frozen: true
  context_policy: question_only
  include_knowledge: false
  max_length: 96
  batch_size: 4
  pooling: last_hidden_state[:,0,:]
  hidden_size: 8
graph:
  k_values: [2]
  cosine_threshold: -1.0
  lpe_dimensions: 4
training:
  learners: [gcn, gat, gt]
  seeds: [42]
  learning_rate: 0.005
  weight_decay: 0.0005
  max_epochs: 2
  validation_interval: 1
  patience: 2
  threads: 1
  model_profile: weighted
  selection_metric: f1
baselines: [linear, knn]
finetuned_deberta:
  enabled: false
  model_name: fixture/deberta
  revision: no-model-download-in-tests
  batch_size: 1
  max_length: 96
  epochs: 1
  learning_rate: 0.00002
  seed_from_matrix: true
  gradient_accumulation: 1
  max_steps: null
evaluation:
  positive_label: 1
  protocol: transductive_full_graph
  test_labels_used_for_training: false
