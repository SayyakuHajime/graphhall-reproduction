[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "graphhall-reproduction"
version = "0.1.0"
description = "Local, reproducible GraphHall research CLI"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.12,<2",
  "scikit-learn>=1.4,<2",
  "PyYAML>=6,<7",
  "torch>=2.6,<3",
  "torch-geometric>=2.6,<3",
  "transformers>=4.48,<5",
  "sentencepiece>=0.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
graphhall = "graphhall.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/graphhall"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
